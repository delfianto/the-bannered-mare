name: Backend CI

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  workflow_dispatch:

# Cancel superseded runs for the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

env:
  # Tests disable the audit writer themselves, but make the intent explicit in CI.
  LOGGING__AUDIT_ENABLED: "false"

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check --output-format=github .

  typecheck:
    name: Type check (basedpyright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Type check
        run: uv run basedpyright

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Run tests
        # Exclude `integration`-marked live provider tests — they make real API
        # calls and require keys, so they are local-only.
        run: uv run pytest -m "not integration"

  integration:
    name: Integration (Postgres + VectorChord)
    runs-on: ubuntu-latest
    env:
      # VectorChord container = Postgres 18 + vchord (on pgvector), matching production parity.
      DATABASE_URL: postgresql://banneredmare:banneredmare@localhost:5432/banneredmare
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          python-version: "3.14"
      - name: Install dependencies
        run: uv sync --locked --extra dev
      - name: Start VectorChord (Postgres + pgvector) via docker
        run: |
          docker run -d --name vchord -p 5432:5432 \
            -e POSTGRES_USER=banneredmare \
            -e POSTGRES_PASSWORD=banneredmare \
            -e POSTGRES_DB=banneredmare \
            docker.io/tensorchord/vchord-postgres:pg18-v1.1.1
      - name: Wait for Postgres to be ready
        run: |
          for i in $(seq 1 30); do
            if docker exec vchord pg_isready -U banneredmare -d banneredmare; then
              echo "postgres ready"; exit 0
            fi
            echo "waiting for postgres ($i)..."; sleep 2
          done
          echo "postgres did not become ready"; docker logs vchord; exit 1
      - name: Apply migrations
        run: uv run alembic upgrade head
      # Scope note (BE-L7): this runs ONLY the `postgres`-marked tests
      # (test_postgres_integration.py — the DB/pgvector path). The other files in
      # tests/integration/ are `integration`-only and call live provider APIs (keys
      # required), so they are NOT exercised here — they run locally/on demand. Add
      # a nightly keyed job if live-provider coverage in CI is ever needed.
      - name: Run Postgres integration tests
        run: uv run pytest -m postgres

  # Single required status check: fails unless EVERY job above succeeded. Because
  # it `needs` the integration job and treats any non-`success` result (including
  # `skipped`) as failure, the Postgres/pgvector job can never silently vanish —
  # the coverage of the app's most differentiated data path can't drop to zero
  # behind a green pipeline. Point branch protection at this job.
  ci-gate:
    name: CI gate (all backend jobs passed)
    if: always()
    needs: [lint, typecheck, test, integration]
    runs-on: ubuntu-latest
    steps:
      - name: Require every backend job to have succeeded
        # Override the workflow-level `backend` working dir (no checkout here).
        working-directory: ${{ github.workspace }}
        run: |
          echo "lint=${{ needs.lint.result }} typecheck=${{ needs.typecheck.result }} test=${{ needs.test.result }} integration=${{ needs.integration.result }}"
          for r in "${{ needs.lint.result }}" "${{ needs.typecheck.result }}" "${{ needs.test.result }}" "${{ needs.integration.result }}"; do
            if [ "$r" != "success" ]; then
              echo "::error::A required backend CI job did not succeed (skipped/failed/cancelled). The Postgres integration job must run and pass."
              exit 1
            fi
          done
          echo "All backend CI jobs succeeded."
