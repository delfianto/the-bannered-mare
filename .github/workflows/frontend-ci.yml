name: Frontend CI

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    name: Build and Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format, Lint and Vue Types
        run: bun run check

      # Canonical Tailwind classes: eslint catches named scales (text-sm,
      # tracking-widest); the script catches dynamic spacing (h-15.5, w-100).
      - name: Tailwind Lint
        run: bun run lint:tailwind

      - name: Canonical Classes
        run: bun run lint:canonical

      # Whole-app floors plus strict per-file gates for critical state/transport.
      # Keep reports available when tests or coverage thresholds fail.
      - name: Test + Coverage
        run: bun run test:coverage

      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: warn
          retention-days: 7

      - name: Build
        run: bun run build
