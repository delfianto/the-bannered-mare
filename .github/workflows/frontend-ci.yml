name: Frontend CI

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend-ci.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    name: Build and Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format Check
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      # Canonical Tailwind classes: eslint catches named scales (text-sm,
      # tracking-widest); the script catches dynamic spacing (h-15.5, w-100).
      - name: Tailwind Lint
        run: bun run lint:tailwind

      - name: Canonical Classes
        run: bun run lint:canonical

      - name: Type Check
        run: bun run typecheck

      # Runs the suite with V8 coverage; the thresholds in vite.config.ts fail
      # the job if coverage drops below the floor (ratchets up as tests land).
      - name: Test + Coverage
        run: bun run test:coverage

      - name: Build
        run: bun run build
