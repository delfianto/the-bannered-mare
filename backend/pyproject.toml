[project]
name = "bannered-mare-backend"
version = "0.5.0"
requires-python = ">=3.14"
license = "AGPL-3.0-or-later"

dependencies = [
    # Web framework
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    # Database
    "sqlalchemy==2.0.52",
    # SQLAlchemy's async engine requires greenlet at runtime (not just for tests).
    "greenlet>=3.0.0",
    "psycopg2-binary==2.9.12",
    "alembic==1.19.1",
    "alembic-postgresql-enum==1.10.0",
    "asyncpg==0.31.0",
    "pgvector==0.5.0",
    # Validation
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    # File handling
    "python-multipart==0.0.32",
    "aiofiles==25.1.0",
    # HTTP client for provider APIs
    "httpx==0.28.1",
    # ID generation
    "nanoid==2.0.0",
    # Utilities
    "python-dotenv==1.2.3",
    # Logging
    "structlog==26.1.0",
    # Prompt templating
    "Jinja2==3.1.6",
    # Token counting
    "tiktoken==0.14.0",
    # Image processing
    "Pillow==12.3.0",
    # HTML sanitization (model-emitted GFX blocks)
    "nh3==0.3.7",
    "tokenizers>=0.23.1",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",

    # Async DB (test-only in-memory driver)
    "aiosqlite==0.22.1",

    # Code quality
    "ruff==0.16.5",
    "basedpyright==1.39.10",

    # Type stubs
    "types-aiofiles==25.1.0.20260518",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# Drives pyupgrade (UP) rules to rewrite code to 3.14-era idioms.
target-version = "py314"
# Auto-generated Alembic migration scripts are not linted or formatted
# (mirrors the basedpyright exclude of alembic/versions/**).
extend-exclude = ["alembic/versions"]
# Honor the exclude even when a path is passed explicitly (e.g. by editor
# integrations or pre-commit/hooks), so migrations are never reformatted.
force-exclude = true

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # import sorting
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "C4",    # flake8-comprehensions
]

# Rules to ignore
ignore = [
    # line too long
    "E501",
    # Do not perform function call `Depends` in argument defaults
    "B008",
]

[tool.basedpyright]
include = ["src", "tests"]
exclude = [
    "**/.venv/**",
    "**/__init__.py",
    "**/__pycache__/**",
    "alembic/versions/**",
    "tests/models_for_tests.py",
]

# Set a baseline mode
typeCheckingMode = "standard"

# Overrides (keep your sanity)
reportAny = false
reportExplicitAny = false
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false

# Prevents hard to debug crashes
reportImportCycles = true

# Python version settings
pythonVersion = "3.14"
pythonPlatform = "Linux"
