<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Bannered Mare — Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', monospace; background: #111; color: #eee; height: 100vh; display: flex; }

  /* Nav sidebar */
  .nav { width: 64px; background: #1a1a1a; border-right: 1px solid #333; display: flex; flex-direction: column; align-items: center; padding: 8px 0; gap: 4px; flex-shrink: 0; }
  .nav a { width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; border-radius: 8px; color: #888; text-decoration: none; font-size: 22px; cursor: pointer; }
  .nav a:hover { background: #2a2a2a; color: #fff; }
  .nav a.active { background: #333; color: #fff; }
  .nav .spacer { flex: 1; }
  .nav .brand { font-size: 11px; color: #555; writing-mode: vertical-rl; text-orientation: mixed; letter-spacing: 2px; }

  /* Main content */
  .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .page { flex: 1; overflow-y: auto; padding: 24px; }
  .page h1 { font-size: 20px; margin-bottom: 16px; font-weight: 600; }
  .page h2 { font-size: 15px; margin: 16px 0 8px; font-weight: 600; color: #aaa; }

  /* Status bar */
  #status { padding: 4px 12px; font-size: 11px; color: #666; border-top: 1px solid #222; min-height: 20px; }

  /* Tables */
  table { width: 100%; border-collapse: collapse; margin: 8px 0; font-size: 13px; }
  th { text-align: left; padding: 8px 12px; border-bottom: 2px solid #333; color: #888; font-weight: 500; }
  td { padding: 8px 12px; border-bottom: 1px solid #222; }
  tr:hover td { background: #1a1a1a; }

  /* Forms */
  .form-group { margin: 8px 0; }
  .form-group label { display: block; font-size: 12px; color: #888; margin-bottom: 4px; }
  input, textarea, select { background: #1a1a1a; color: #eee; border: 1px solid #333; border-radius: 4px; padding: 8px 10px; font-size: 13px; font-family: inherit; width: 100%; }
  input:focus, textarea:focus, select:focus { outline: 1px solid #666; }
  textarea { resize: vertical; min-height: 60px; }
  .form-row { display: flex; gap: 12px; }
  .form-row > * { flex: 1; }

  /* Buttons */
  btn, .btn { display: inline-block; padding: 8px 16px; border: 1px solid #444; border-radius: 4px; background: #222; color: #eee; font-size: 13px; cursor: pointer; font-family: inherit; text-decoration: none; }
  .btn:hover { background: #333; }
  .btn-primary { background: #2a5298; border-color: #2a5298; }
  .btn-primary:hover { background: #3563ad; }
  .btn-danger { background: #8b2020; border-color: #8b2020; }
  .btn-danger:hover { background: #a02525; }
  .btn-sm { padding: 4px 10px; font-size: 12px; }
  .btn-group { display: flex; gap: 8px; margin: 12px 0; }

  /* Chat UI */
  .chat-layout { display: flex; height: 100%; gap: 0; }
  .chat-sidebar { width: 240px; border-right: 1px solid #222; display: flex; flex-direction: column; flex-shrink: 0; overflow-y: auto; }
  .chat-sidebar .item { padding: 10px 12px; cursor: pointer; font-size: 13px; border-bottom: 1px solid #1a1a1a; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat-sidebar .item:hover { background: #1a1a1a; }
  .chat-sidebar .item.active { background: #222; border-left: 3px solid #666; }
  .chat-main { flex: 1; display: flex; flex-direction: column; }
  .chat-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 75%; padding: 10px 14px; border-radius: 8px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: #1a2a3a; }
  .msg.assistant { align-self: flex-start; background: #1a1a1a; border: 1px solid #2a2a2a; }
  .msg.system { align-self: center; color: #888; font-style: italic; font-size: 12px; background: none; }
  .msg .reasoning { color: #777; font-size: 12px; font-style: italic; margin-bottom: 6px; padding-bottom: 6px; border-bottom: 1px solid #2a2a2a; }
  .streaming::after { content: ''; display: inline-block; width: 7px; height: 13px; background: #eee; animation: blink .7s infinite; margin-left: 2px; vertical-align: middle; }
  @keyframes blink { 50% { opacity: 0; } }
  .chat-input { display: flex; gap: 8px; padding: 12px; border-top: 1px solid #222; }
  .chat-input textarea { flex: 1; min-height: 40px; max-height: 100px; }
  .chat-input .btn { white-space: nowrap; }
  .chat-controls { padding: 8px 12px; border-bottom: 1px solid #222; display: flex; gap: 8px; align-items: center; font-size: 12px; }
  .chat-controls select { width: auto; max-width: 160px; padding: 4px 8px; }
  .chat-controls span { color: #666; }

  /* File upload */
  .file-drop { border: 2px dashed #333; border-radius: 8px; padding: 24px; text-align: center; color: #666; cursor: pointer; }
  .file-drop:hover { border-color: #555; color: #999; }

  /* Badge */
  .badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-size: 11px; background: #2a2a2a; }
  .badge-green { background: #1a3a1a; color: #6c6; }
  .badge-red { background: #3a1a1a; color: #c66; }
</style>
</head>
<body>

<nav class="nav">
  <a href="#chat" title="Chat" id="nav-chat">&#x1F4AC;</a>
  <a href="#characters" title="Characters" id="nav-characters">&#x1F9D1;</a>
  <a href="#models" title="Models" id="nav-models">&#x2699;</a>
  <a href="#providers" title="Providers" id="nav-providers">&#x1F50C;</a>
  <a href="#templates" title="Templates" id="nav-templates">&#x1F4DD;</a>
  <a href="#databank" title="Data Bank" id="nav-databank">&#x1F4DA;</a>
  <div class="spacer"></div>
  <span class="brand">THE BANNERED MARE</span>
</nav>

<div class="main">
  <div class="page" id="page"></div>
  <div id="status"></div>
</div>

<script>
const API = window.location.origin;
let currentChatId = null;
let isStreaming = false;

// --- Helpers ---
function $(id) { return document.getElementById(id); }
function setStatus(t) { $('status').textContent = t; }
function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

async function api(path, opts = {}) {
  const res = await fetch(`${API}${path}`, { headers: { 'Content-Type': 'application/json', ...opts.headers }, ...opts });
  if (!res.ok) { let d = `${res.status}`; try { const b = await res.json(); d = b.detail || d; } catch {} setStatus(`Error: ${d}`); throw new Error(d); }
  return opts.raw ? res : res.json();
}
// Normalize paginated vs plain list responses
function items(data) { return Array.isArray(data) ? data : data.items || []; }

// --- Router ---
function navigate(hash) {
  const page = (hash || '#chat').replace('#', '');
  document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('active', a.getAttribute('href') === `#${page}`));
  const render = pages[page] || pages.chat;
  $('page').innerHTML = '';
  render($('page'));
}
window.addEventListener('hashchange', () => navigate(location.hash));

// ==================== PAGES ====================

const pages = {};

// --- CHAT PAGE ---
pages.chat = async (el) => {
  el.innerHTML = `
    <div class="chat-layout" style="height:100%">
      <div class="chat-sidebar">
        <div style="padding:8px"><button class="btn btn-primary" style="width:100%" onclick="newChat()">+ New Chat</button></div>
        <div id="chatList"></div>
      </div>
      <div class="chat-main">
        <div class="chat-controls">
          <select id="chatCharSel" style="max-width:140px"><option>Loading...</option></select>
          <select id="chatModelSel" style="max-width:140px"><option>Loading...</option></select>
          <span id="chatInfo"></span>
        </div>
        <div class="chat-messages" id="chatMsgs"></div>
        <div class="chat-input">
          <textarea id="chatInput" placeholder="Type a message..." rows="1"></textarea>
          <button class="btn" onclick="regenMsg()" title="Regenerate">&#x21bb;</button>
          <button class="btn btn-primary" onclick="sendMsg()">Send</button>
        </div>
      </div>
    </div>`;
  $('chatInput').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); } });
  $('chatInput').addEventListener('input', function() { this.style.height = 'auto'; this.style.height = Math.min(this.scrollHeight, 100) + 'px'; });
  await loadChatDropdowns();
  await loadChatList();
};

async function loadChatDropdowns() {
  const [chars, models] = await Promise.all([api('/api/characters?limit=100'), api('/api/models?limit=100')]);
  $('chatCharSel').innerHTML = '<option value="">Character...</option>' + items(chars).map(c => `<option value="${c.id}">${escHtml(c.name)}</option>`).join('');
  $('chatModelSel').innerHTML = '<option value="">Model...</option>' + items(models).map(m => `<option value="${m.id}">${escHtml(m.name)}</option>`).join('');
}

async function loadChatList() {
  const data = await api('/api/chats?limit=50');
  $('chatList').innerHTML = items(data).map(c =>
    `<div class="item${c.id === currentChatId ? ' active' : ''}" onclick="openChat('${c.id}')">${escHtml(c.title || c.preview || 'Untitled')}</div>`
  ).join('') || '<div style="padding:12px;color:#555;font-size:12px">No chats yet</div>';
}

async function openChat(id) {
  currentChatId = id;
  const [data, chat] = await Promise.all([api(`/api/chats/${id}/messages?limit=100`), api(`/api/chats/${id}`)]);
  $('chatMsgs').innerHTML = '';
  [...items(data)].reverse().forEach(m => addMsg(m.role, m.content, m.reasoning_content));
  $('chatInfo').textContent = `${chat.character?.name || '?'} / ${chat.model?.name || '?'}`;
  // Sync dropdowns with current chat's character and model
  if (chat.character?.id) $('chatCharSel').value = chat.character.id;
  if (chat.model?.id) $('chatModelSel').value = chat.model.id;
  scrollChat();
  loadChatList();
}

async function newChat() {
  const cid = $('chatCharSel').value, mid = $('chatModelSel').value;
  if (!cid) return alert('Select a character'); if (!mid) return alert('Select a model');
  const chat = await api('/api/chats', { method: 'POST', body: JSON.stringify({ character_id: cid, model_id: mid }) });
  await openChat(chat.id);
}

function addMsg(role, content, reasoning) {
  const d = document.createElement('div'); d.className = `msg ${role}`;
  d.innerHTML = (reasoning ? `<div class="reasoning">${escHtml(reasoning)}</div>` : '') + escHtml(content || '');
  $('chatMsgs').appendChild(d); return d;
}
function scrollChat() { const m = $('chatMsgs'); if (m) m.scrollTop = m.scrollHeight; }

async function sendMsg() {
  if (isStreaming) return;
  const input = $('chatInput'), content = input.value.trim(); if (!content) return;
  if (!currentChatId) {
    const cid = $('chatCharSel').value, mid = $('chatModelSel').value;
    if (!cid || !mid) {
      addMsg('system', !cid ? 'Select a character from the dropdown above.' : 'Select a model from the dropdown above.');
      scrollChat(); return;
    }
    try { await newChat(); } catch { return; }
    if (!currentChatId) return;
  }
  input.value = ''; addMsg('user', content); scrollChat();
  await streamMsg(content, false);
}
async function regenMsg() { if (!currentChatId || isStreaming) return; await streamMsg(null, true); }

async function streamMsg(content, regen) {
  isStreaming = true;
  const url = `${API}/api/chats/${currentChatId}/messages?stream=true${regen ? '&regenerate=true' : ''}`;
  try {
    const res = await fetch(url, { method: 'POST', headers: content ? { 'Content-Type': 'application/json' } : {}, body: content ? JSON.stringify({ content }) : null });
    const div = addMsg('assistant', ''); div.classList.add('streaming');
    let full = '', reasoning = '';
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = '';
    while (true) {
      const { done, value } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      for (const line of buf.split('\n')) {
        if (!line.startsWith('data: ')) continue;
        try {
          const ev = JSON.parse(line.slice(6));
          if (ev.type === 'text') { full += ev.content; div.innerHTML = (reasoning ? `<div class="reasoning">${escHtml(reasoning)}</div>` : '') + escHtml(full); div.classList.add('streaming'); scrollChat(); }
          else if (ev.type === 'reasoning') { reasoning += ev.content; }
          else if (ev.type === 'usage') { setStatus(`${ev.input_tokens||0} in / ${ev.output_tokens||0} out${ev.cache_read_tokens ? ` (${ev.cache_read_tokens} cached)` : ''}`); }
          else if (ev.type === 'done') { div.classList.remove('streaming'); }
          else if (ev.type === 'error') { div.textContent = `Error: ${ev.message}`; div.style.color = '#c66'; }
        } catch {}
      }
      buf = buf.endsWith('\n') ? '' : buf.split('\n').pop() || '';
    }
    div.classList.remove('streaming');
    if (reasoning) div.innerHTML = `<div class="reasoning">${escHtml(reasoning)}</div>` + escHtml(full);
  } catch (e) { setStatus(`Stream error: ${e.message}`); }
  isStreaming = false;
}

// --- CHARACTERS PAGE ---
pages.characters = async (el) => {
  el.innerHTML = '<h1>Characters</h1><div class="btn-group"><button class="btn btn-primary" onclick="showCharForm()">+ Create Character</button><label class="btn" style="cursor:pointer">Import PNG<input type="file" accept=".png,.json" style="display:none" onchange="importChar(this)"></label></div><div id="charFormArea"></div><table><thead><tr><th>Name</th><th>Tags</th><th>Created</th><th></th></tr></thead><tbody id="charTable"></tbody></table>';
  const data = await api('/api/characters?limit=100');
  $('charTable').innerHTML = items(data).map(c => `<tr>
    <td><strong>${escHtml(c.name)}</strong></td>
    <td>${(c.tags||[]).map(t => `<span class="badge">${escHtml(t)}</span>`).join(' ')}</td>
    <td style="color:#666;font-size:12px">${new Date(c.created_at).toLocaleDateString()}</td>
    <td><button class="btn btn-sm btn-danger" onclick="deleteChar('${c.id}')">Delete</button></td>
  </tr>`).join('') || '<tr><td colspan="4" style="color:#555">No characters. Create one or import a PNG card.</td></tr>';
};

function showCharForm() {
  $('charFormArea').innerHTML = `
    <div style="border:1px solid #333;padding:16px;border-radius:8px;margin:8px 0">
      <h2>New Character</h2>
      <div class="form-row">
        <div class="form-group"><label>Name *</label><input id="charName"></div>
        <div class="form-group"><label>Creator</label><input id="charCreator"></div>
      </div>
      <div class="form-group"><label>Description</label><textarea id="charDesc" rows="2"></textarea></div>
      <div class="form-group"><label>Personality</label><textarea id="charPersonality" rows="2"></textarea></div>
      <div class="form-group"><label>First Message</label><textarea id="charFirstMsg" rows="2"></textarea></div>
      <div class="form-group"><label>Scenario</label><textarea id="charScenario" rows="2"></textarea></div>
      <div class="btn-group"><button class="btn btn-primary" onclick="createChar()">Create</button><button class="btn" onclick="$('charFormArea').innerHTML=''">Cancel</button></div>
    </div>`;
}

async function createChar() {
  const fd = new FormData();
  fd.append('name', $('charName').value);
  fd.append('description', $('charDesc').value);
  fd.append('personality', $('charPersonality').value);
  fd.append('first_message', $('charFirstMsg').value);
  fd.append('scenario', $('charScenario').value);
  fd.append('creator', $('charCreator').value);
  await fetch(`${API}/api/characters`, { method: 'POST', body: fd });
  setStatus('Character created.'); navigate('#characters');
}

async function importChar(input) {
  if (!input.files.length) return;
  const fd = new FormData(); fd.append('file', input.files[0]);
  await fetch(`${API}/api/characters/import`, { method: 'POST', body: fd });
  setStatus('Character imported.'); navigate('#characters');
}

async function deleteChar(id) {
  if (!confirm('Delete this character?')) return;
  await api(`/api/characters/${id}`, { method: 'DELETE' });
  setStatus('Character deleted.'); navigate('#characters');
}

// --- MODELS PAGE ---
pages.models = async (el) => {
  el.innerHTML = '<h1>Models</h1><table><thead><tr><th>Name</th><th>Identifier</th><th>Provider</th><th>Enabled</th><th></th></tr></thead><tbody id="modelTable"></tbody></table>';
  const data = await api('/api/models?limit=100');
  $('modelTable').innerHTML = items(data).map(m => `<tr>
    <td><strong>${escHtml(m.name)}</strong></td>
    <td style="color:#888;font-size:12px">${escHtml(m.model_identifier)}</td>
    <td style="font-size:12px">${escHtml(m.provider_id)}</td>
    <td>${m.enabled ? '<span class="badge badge-green">On</span>' : '<span class="badge badge-red">Off</span>'}</td>
    <td><button class="btn btn-sm" onclick="toggleModel('${m.id}',${!m.enabled})">${m.enabled ? 'Disable' : 'Enable'}</button></td>
  </tr>`).join('') || '<tr><td colspan="5" style="color:#555">No models. Run the server with SEED_MODELS=true to seed default models.</td></tr>';
};

async function toggleModel(id, enabled) {
  await api(`/api/models/${id}/flags`, { method: 'PATCH', body: JSON.stringify({ enabled }) });
  navigate('#models');
}

// --- PROVIDERS PAGE ---
pages.providers = async (el) => {
  el.innerHTML = '<h1>Providers</h1><table><thead><tr><th>Name</th><th>Type</th><th>Base URL</th><th>API Key</th><th>Enabled</th></tr></thead><tbody id="provTable"></tbody></table>';
  const data = await api('/api/providers');
  $('provTable').innerHTML = items(data).map(p => `<tr>
    <td><strong>${escHtml(p.name)}</strong></td>
    <td><span class="badge">${escHtml(p.provider_type)}</span></td>
    <td style="color:#888;font-size:12px">${escHtml(p.base_url || 'default')}</td>
    <td>${p.api_key_configured ? '<span class="badge badge-green">Set</span>' : '<span class="badge badge-red">Missing</span>'}</td>
    <td>${p.enabled ? '<span class="badge badge-green">On</span>' : '<span class="badge badge-red">Off</span>'}</td>
  </tr>`).join('') || '<tr><td colspan="5" style="color:#555">No providers.</td></tr>';
};

// --- TEMPLATES PAGE ---
pages.templates = async (el) => {
  el.innerHTML = '<h1>Prompt Templates</h1><table><thead><tr><th>Name</th><th>Default</th><th>Description</th></tr></thead><tbody id="tmplTable"></tbody></table>';
  const data = await api('/api/prompt-templates?limit=100');
  $('tmplTable').innerHTML = items(data).map(t => `<tr>
    <td><strong>${escHtml(t.name)}</strong></td>
    <td>${t.is_default ? '<span class="badge badge-green">Default</span>' : ''}</td>
    <td style="color:#888;font-size:12px">${escHtml(t.description || '')}</td>
  </tr>`).join('') || '<tr><td colspan="3" style="color:#555">No templates.</td></tr>';
};

// --- DATA BANK PAGE ---
pages.databank = async (el) => {
  el.innerHTML = '<h1>Data Bank</h1><div class="btn-group"><button class="btn btn-primary" onclick="showDbForm()">+ Add Entry</button></div><div id="dbFormArea"></div><table><thead><tr><th>Name</th><th>Scope</th><th>Content</th><th></th></tr></thead><tbody id="dbTable"></tbody></table>';
  const data = await api('/api/data-bank/');
  $('dbTable').innerHTML = items(data).map(e => `<tr>
    <td><strong>${escHtml(e.name)}</strong></td>
    <td><span class="badge">${escHtml(e.scope)}</span></td>
    <td style="color:#888;font-size:12px;max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(e.content.slice(0, 120))}</td>
    <td><button class="btn btn-sm btn-danger" onclick="deleteDb('${e.id}')">Delete</button></td>
  </tr>`).join('') || '<tr><td colspan="4" style="color:#555">No entries. Add knowledge for RAG retrieval.</td></tr>';
};

function showDbForm() {
  $('dbFormArea').innerHTML = `
    <div style="border:1px solid #333;padding:16px;border-radius:8px;margin:8px 0">
      <h2>New Data Bank Entry</h2>
      <div class="form-row">
        <div class="form-group"><label>Name *</label><input id="dbName"></div>
        <div class="form-group"><label>Scope</label><select id="dbScope"><option value="global">Global</option><option value="character">Character</option><option value="chat">Chat</option></select></div>
      </div>
      <div class="form-group"><label>Content *</label><textarea id="dbContent" rows="4"></textarea></div>
      <div class="btn-group"><button class="btn btn-primary" onclick="createDb()">Create</button><button class="btn" onclick="$('dbFormArea').innerHTML=''">Cancel</button></div>
    </div>`;
}

async function createDb() {
  await api('/api/data-bank/', { method: 'POST', body: JSON.stringify({ name: $('dbName').value, content: $('dbContent').value, scope: $('dbScope').value }) });
  setStatus('Entry created.'); navigate('#databank');
}

async function deleteDb(id) {
  if (!confirm('Delete this entry?')) return;
  await api(`/api/data-bank/${id}`, { method: 'DELETE' });
  setStatus('Entry deleted.'); navigate('#databank');
}

// --- Init ---
navigate(location.hash || '#chat');
</script>
</body>
</html>
