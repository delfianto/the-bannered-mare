<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Bannered Mare</title>
    <script>
      // Set the daisyUI theme before paint to avoid a flash of the default theme.
      (function () {
        try {
          // Root font size (rem base) — applied before paint so text doesn't reflow.
          var fs = parseInt(localStorage.getItem("font-size"), 10);
          if (!fs || fs < 14 || fs > 24) fs = 18;
          document.documentElement.style.fontSize = fs + "px";

          // Chat column width preference.
          var cwMap = { narrow: "56rem", cozy: "72rem", wide: "88rem", full: "100%" };
          document.documentElement.style.setProperty(
            "--chat-max-width",
            cwMap[localStorage.getItem("chat-width")] || "72rem",
          );

          // Typography preferences — attributes select CSS font stacks before paint.
          var typography = localStorage.getItem("typography-preset");
          var chatFont = localStorage.getItem("chat-font");
          document.documentElement.dataset.typography =
            ["storybook", "literary", "modern", "system"].indexOf(typography) >= 0
              ? typography
              : "storybook";
          document.documentElement.dataset.chatFont =
            ["match", "newsreader", "literata", "inter", "georgia"].indexOf(chatFont) >= 0
              ? chatFont
              : "match";
          document.documentElement.dataset.narrativeItalics =
            localStorage.getItem("narrative-italics") === "true" ? "true" : "false";

          var mode = localStorage.getItem("theme-mode");
          var scheme = localStorage.getItem("color-scheme") || "amber";
          var dark =
            mode === "dark" || (!mode && matchMedia("(prefers-color-scheme: dark)").matches);
          var el = document.documentElement;
          if (scheme === "custom") {
            el.dataset.theme = "tbm-custom";
            var c = JSON.parse(localStorage.getItem("custom-theme") || "{}");
            var s = el.style;
            if (c.base100) s.setProperty("--color-base-100", c.base100);
            if (c.base200) s.setProperty("--color-base-200", c.base200);
            if (c.base300) {
              s.setProperty("--color-base-300", c.base300);
              s.setProperty("--color-border", c.base300);
              s.setProperty("--color-input", c.base300);
            }
            if (c.baseContent) s.setProperty("--color-base-content", c.baseContent);
            if (c.primary) {
              s.setProperty("--color-primary", c.primary);
              s.setProperty("--color-ring", c.primary);
            }
          } else {
            el.dataset.theme = "tbm-" + scheme + (dark ? "-dark" : "");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
